<!-- Disable touchscreen mini-player swipe -->
<div class="setting-row">
    <div class="setting-info">
        <span class="setting-name">Disable touchscreen mini-player swipe</span>
        <span class="setting-desc">Prevents accidental mini-player activation when swiping down on touch devices</span>
    </div>
    <div class="setting-control">
        <input type="checkbox" id="disableTouchGestureMiniPlayer" data-storage="disableTouchGestureMiniPlayer">
        <label for="disableTouchGestureMiniPlayer" class="toggle"></label>
    </div>
</div>
